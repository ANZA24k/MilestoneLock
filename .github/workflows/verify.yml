name: Verify MilestoneLock
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci
      - run: npm run test:web
      - run: npm run build
      - run: pip install -r requirements-test.txt
      - run: pytest -q tests
      - run: genvm-lint check contracts/milestone_lock.py
      - run: genvm-lint check contracts/milestone_plan.py

      - uses: actions/upload-artifact@v4
        with:
          name: milestonelock-v2-site
          path: dist/
          retention-days: 14
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run audit:receipt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milestonelock-v2-live-audit
          path: artifacts/milestone-v2-audit.json
          retention-days: 14
